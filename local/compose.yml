name: yalom-local

services:
  db:
    image: mysql:8.4

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yalom}

    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
      
  backend:
    build:
      context: ..
      dockerfile: Dockerfile

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.miniapp

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8080:80"

volumes:
  mysql-data: