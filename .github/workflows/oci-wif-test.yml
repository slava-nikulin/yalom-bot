name: OCI WIF test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI SDK
        run: |
          python -m pip install 'oci>=2.187.1,<3' requests

      - name: Test OCI WIF and Vault access
        env:
          OCI_WIF_CLIENT_ID: ${{ vars.OCI_WIF_CLIENT_ID }}
          OCI_WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
          OCI_DOMAIN_URL: ${{ vars.OCI_DOMAIN_URL }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}
        run: |
            python <<'PY'
            import base64
            import json
            import os

            import oci
            import requests
            from cryptography.hazmat.primitives import serialization
            from cryptography.hazmat.primitives.asymmetric import rsa


            def decode_jwt_claims(token: str) -> dict:
                payload = token.split(".")[1]
                payload += "=" * (-len(payload) % 4)

                return json.loads(
                    base64.urlsafe_b64decode(payload)
                )


            # ------------------------------------------------------------------
            # GitHub OIDC
            # ------------------------------------------------------------------

            response = requests.get(
                os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"],
                headers={
                    "Authorization": (
                        f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
                    ),
                },
                params={
                    "audience": "oci-wif",
                },
                timeout=30,
            )
            response.raise_for_status()

            github_jwt = response.json()["value"]
            claims = decode_jwt_claims(github_jwt)

            expected_claims = {
                "iss": "https://token.actions.githubusercontent.com",
                "repository": "slava-nikulin/yalom-bot",
                "ref": "refs/heads/main",
                "ref_type": "branch",
            }

            for name, expected in expected_claims.items():
                actual = claims.get(name)

                if actual != expected:
                    raise RuntimeError(
                        f"Unexpected GitHub OIDC claim {name!r}: "
                        f"expected {expected!r}, got {actual!r}"
                    )

            audience = claims.get("aud")

            if (
                audience != "oci-wif"
                and not (
                    isinstance(audience, list)
                    and "oci-wif" in audience
                )
            ):
                raise RuntimeError(
                    f"Unexpected GitHub OIDC audience: {audience!r}"
                )

            print("GitHub OIDC token received")
            print("GitHub OIDC claims validated")


            # ------------------------------------------------------------------
            # Ephemeral key for OCI RPST
            # ------------------------------------------------------------------

            private_key = rsa.generate_private_key(
                public_exponent=65537,
                key_size=2048,
            )

            private_pem = private_key.private_bytes(
                encoding=serialization.Encoding.PEM,
                format=serialization.PrivateFormat.PKCS8,
                encryption_algorithm=serialization.NoEncryption(),
            ).decode()

            public_pem = private_key.public_key().public_bytes(
                encoding=serialization.Encoding.PEM,
                format=serialization.PublicFormat.SubjectPublicKeyInfo,
            ).decode()


            # ------------------------------------------------------------------
            # GitHub JWT -> OCI RPST
            # ------------------------------------------------------------------

            token_url = (
                f"{os.environ['OCI_DOMAIN_URL'].rstrip('/')}"
                "/oauth2/v1/token"
            )

            response = requests.post(
                token_url,
                auth=(
                    os.environ["OCI_WIF_CLIENT_ID"],
                    os.environ["OCI_WIF_CLIENT_SECRET"],
                ),
                data={
                    "grant_type": (
                        "urn:ietf:params:oauth:grant-type:token-exchange"
                    ),
                    "requested_token_type": (
                        "urn:oci:token-type:oci-rpst"
                    ),
                    "subject_token_type": "jwt",
                    "subject_token": github_jwt,
                    "public_key": public_pem,
                    "res_type": "githubactions",
                    "rpst_exp": "20",
                },
                timeout=30,
            )

            if not response.ok:
                print(
                    "OCI token exchange failed: "
                    f"HTTP {response.status_code}"
                )
                print(response.text[:4000])
                response.raise_for_status()

            token_response = response.json()

            try:
                rpst = token_response["token"]
            except KeyError as error:
                raise RuntimeError(
                    "OCI token exchange response contains no RPST token"
                ) from error

            print("OCI RPST received")


            # ------------------------------------------------------------------
            # OCI API client
            # ------------------------------------------------------------------

            signer = oci.auth.signers.EphemeralResourcePrincipalSigner(
                session_token=rpst,
                private_key=private_pem,
                region=os.environ["OCI_REGION"],
            )

            secrets_client = oci.secrets.SecretsClient(
                {
                    "region": os.environ["OCI_REGION"],
                },
                signer=signer,
            )


            # ------------------------------------------------------------------
            # Vault smoke test
            # ------------------------------------------------------------------

            bundle = secrets_client.get_secret_bundle_by_name(
                secret_name="yalom-telegram-token",
                vault_id=os.environ["OCI_VAULT_ID"],
                stage="CURRENT",
            ).data

            content = bundle.secret_bundle_content.content

            if not content:
                raise RuntimeError("Vault secret content is empty")

            print("Vault secret successfully retrieved")
            PY