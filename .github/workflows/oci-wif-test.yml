name: OCI WIF test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI SDK
        run: |
          python -m pip install 'oci>=2.187.1,<3' requests

      - name: Test OCI WIF and Vault access
        env:
          OCI_WIF_CLIENT_ID: ${{ vars.OCI_WIF_CLIENT_ID }}
          OCI_WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
          OCI_DOMAIN_URL: ${{ vars.OCI_DOMAIN_URL }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}
        run: |
            python <<'PY'
            import base64
            import hashlib
            import json
            import os
            import sys
            from urllib.parse import urlsplit

            import oci
            import requests
            from cryptography.hazmat.primitives import serialization
            from cryptography.hazmat.primitives.asymmetric import rsa


            EXPECTED_CLAIMS = {
                "iss": "https://token.actions.githubusercontent.com",
                "aud": "oci-wif",
                "repository": "slava-nikulin/yalom-bot",
                "ref": "refs/heads/main",
                "ref_type": "branch",
            }


            def heading(title):
                print()
                print("=" * 72)
                print(title)
                print("=" * 72)


            def decode_jwt_part(value):
                value += "=" * (-len(value) % 4)
                return json.loads(base64.urlsafe_b64decode(value))


            def decode_jwt(token):
                parts = token.split(".")

                if len(parts) != 3:
                    raise RuntimeError(
                        f"Expected a three-part JWT, got {len(parts)} parts"
                    )

                return (
                    decode_jwt_part(parts[0]),
                    decode_jwt_part(parts[1]),
                )


            def fingerprint(value):
                return hashlib.sha256(value.encode()).hexdigest()[:16]


            def safe_response(response):
                print(f"HTTP status: {response.status_code}")
                print(f"Content-Type: {response.headers.get('content-type')}")

                for name in (
                    "opc-request-id",
                    "request-id",
                    "x-request-id",
                    "www-authenticate",
                ):
                    value = response.headers.get(name)

                    if value:
                        print(f"{name}: {value}")

                body = response.text.strip()

                if body:
                    # Token endpoint errors do not contain our submitted JWT/secret,
                    # but cap output anyway.
                    print("Response body:")
                    print(body[:4000])


            def require_env(name):
                value = os.environ.get(name)

                if not value:
                    raise RuntimeError(f"Missing environment variable: {name}")

                return value


            # ------------------------------------------------------------------
            # Environment
            # ------------------------------------------------------------------

            heading("1. Environment")

            domain_url = require_env("OCI_DOMAIN_URL").rstrip("/")
            client_id = require_env("OCI_WIF_CLIENT_ID")
            client_secret = require_env("OCI_WIF_CLIENT_SECRET")
            region = require_env("OCI_REGION")
            vault_id = require_env("OCI_VAULT_ID")

            oidc_url = require_env("ACTIONS_ID_TOKEN_REQUEST_URL")
            oidc_request_token = require_env("ACTIONS_ID_TOKEN_REQUEST_TOKEN")

            parsed_domain = urlsplit(domain_url)
            parsed_oidc = urlsplit(oidc_url)

            print(f"Python: {sys.version.split()[0]}")
            print(f"OCI SDK: {oci.__version__}")
            print(f"requests: {requests.__version__}")
            print(f"OCI domain: {parsed_domain.scheme}://{parsed_domain.netloc}")
            print(f"OCI region: {region}")
            print(f"OCI WIF client ID: {client_id}")
            print(f"OCI Vault ID: {vault_id}")
            print(
                "OCI client secret present: "
                f"{'yes' if client_secret else 'no'}"
            )
            print(
                "OCI client secret has surrounding whitespace: "
                f"{client_secret != client_secret.strip()}"
            )
            print(
                "GitHub OIDC endpoint: "
                f"{parsed_oidc.scheme}://{parsed_oidc.netloc}{parsed_oidc.path}"
            )


            # ------------------------------------------------------------------
            # GitHub OIDC
            # ------------------------------------------------------------------

            heading("2. GitHub OIDC")

            response = requests.get(
                oidc_url,
                headers={
                    "Authorization": f"Bearer {oidc_request_token}",
                },
                params={
                    "audience": EXPECTED_CLAIMS["aud"],
                },
                timeout=30,
            )

            print(f"OIDC endpoint HTTP status: {response.status_code}")
            response.raise_for_status()

            github_jwt = response.json().get("value")

            if not github_jwt:
                raise RuntimeError("GitHub OIDC response contains no JWT")

            header, claims = decode_jwt(github_jwt)

            print(f"JWT fingerprint: sha256:{fingerprint(github_jwt)}")
            print(f"JWT alg: {header.get('alg')}")
            print(f"JWT kid: {header.get('kid')}")

            print()
            print("Relevant claims:")

            for name in (
                "iss",
                "aud",
                "sub",
                "repository",
                "repository_owner",
                "ref",
                "ref_type",
                "workflow",
                "workflow_ref",
                "event_name",
            ):
                if name in claims:
                    print(f"  {name}: {claims[name]}")

            print()
            print("Trust validation:")

            claim_errors = []

            for name, expected in EXPECTED_CLAIMS.items():
                actual = claims.get(name)

                if name == "aud" and isinstance(actual, list):
                    valid = expected in actual
                else:
                    valid = actual == expected

                print(
                    f"  {name}: "
                    f"{'OK' if valid else 'MISMATCH'}"
                )

                if not valid:
                    claim_errors.append(
                        f"{name}: expected {expected!r}, got {actual!r}"
                    )

            if claim_errors:
                raise RuntimeError(
                    "GitHub JWT does not match OCI trust:\n"
                    + "\n".join(claim_errors)
                )

            print("GitHub OIDC JWT matches expected trust claims")


            # ------------------------------------------------------------------
            # Ephemeral RSA key
            # ------------------------------------------------------------------

            heading("3. Ephemeral RPST key")

            private_key = rsa.generate_private_key(
                public_exponent=65537,
                key_size=2048,
            )

            private_pem = private_key.private_bytes(
                encoding=serialization.Encoding.PEM,
                format=serialization.PrivateFormat.PKCS8,
                encryption_algorithm=serialization.NoEncryption(),
            ).decode()

            public_pem = private_key.public_key().public_bytes(
                encoding=serialization.Encoding.PEM,
                format=serialization.PublicFormat.SubjectPublicKeyInfo,
            ).decode()

            # This is how OCI's current Python TokenExchangeSigner serializes
            # the public key: base64 body only, without PEM markers/newlines.
            public_compact = (
                public_pem
                .replace("-----BEGIN PUBLIC KEY-----", "")
                .replace("-----END PUBLIC KEY-----", "")
                .replace("\n", "")
            )

            print("RSA key size: 2048")
            print(f"PEM public key length: {len(public_pem)}")
            print(f"Compact public key length: {len(public_compact)}")
            print(
                "Public key fingerprint: sha256:"
                f"{fingerprint(public_compact)}"
            )


            # ------------------------------------------------------------------
            # OCI token exchange
            # ------------------------------------------------------------------

            heading("4. OCI JWT -> RPST token exchange")

            token_url = f"{domain_url}/oauth2/v1/token"

            common_payload = {
                "grant_type":
                    "urn:ietf:params:oauth:grant-type:token-exchange",
                "requested_token_type":
                    "urn:oci:token-type:oci-rpst",
                "subject_token_type":
                    "jwt",
                "subject_token":
                    github_jwt,
                "res_type":
                    "githubactions",
            }

            print(f"Endpoint: {token_url}")
            print("Authentication: HTTP Basic (client ID + client secret)")
            print("Safe request parameters:")
            print(f"  grant_type: {common_payload['grant_type']}")
            print(
                "  requested_token_type: "
                f"{common_payload['requested_token_type']}"
            )
            print(
                "  subject_token_type: "
                f"{common_payload['subject_token_type']}"
            )
            print(f"  res_type: {common_payload['res_type']}")
            print(
                "  subject_token: "
                f"<redacted, {len(github_jwt)} chars, "
                f"sha256:{fingerprint(github_jwt)}>"
            )

            # Try the most likely/canonical representation first.
            #
            # We intentionally test more than one representation in this single
            # workflow run so that diagnosing OCI does not require another commit.
            attempts = [
                (
                    "compact public key, minimal request",
                    {
                        **common_payload,
                        "public_key": public_compact,
                    },
                ),
                (
                    "compact public key + rpst_exp=20",
                    {
                        **common_payload,
                        "public_key": public_compact,
                        "rpst_exp": "20",
                    },
                ),
                (
                    "full PEM public key, minimal request",
                    {
                        **common_payload,
                        "public_key": public_pem,
                    },
                ),
            ]

            rpst = None
            successful_attempt = None

            for number, (description, payload) in enumerate(attempts, 1):
                print()
                print(f"Attempt {number}: {description}")
                print(
                    "  public_key: "
                    f"<redacted, {len(payload['public_key'])} chars>"
                )
                print(
                    "  rpst_exp: "
                    f"{payload.get('rpst_exp', '<omitted>')}"
                )

                response = requests.post(
                    token_url,
                    auth=(client_id, client_secret),
                    headers={
                        "Content-Type":
                            "application/x-www-form-urlencoded;charset=UTF-8",
                        "Accept": "application/json",
                    },
                    data=payload,
                    timeout=30,
                    allow_redirects=False,
                )

                safe_response(response)

                if response.ok:
                    try:
                        token_response = response.json()
                    except ValueError as error:
                        raise RuntimeError(
                            "OCI returned HTTP success but response is not JSON"
                        ) from error

                    rpst = token_response.get("token")

                    if not rpst:
                        raise RuntimeError(
                            "OCI token exchange succeeded but response "
                            "contains no 'token'"
                        )

                    successful_attempt = description

                    print(
                        "RPST received: "
                        f"<redacted, {len(rpst)} chars, "
                        f"sha256:{fingerprint(rpst)}>"
                    )
                    break

            if rpst is None:
                raise RuntimeError(
                    "All OCI RPST token exchange attempts failed. "
                    "See diagnostics above."
                )

            print()
            print(f"Successful exchange variant: {successful_attempt}")


            # ------------------------------------------------------------------
            # RPST signer
            # ------------------------------------------------------------------

            heading("5. OCI RPST signer")

            try:
                signer = oci.auth.signers.EphemeralResourcePrincipalSigner(
                    session_token=rpst,
                    private_key=private_pem,
                    region=region,
                )
            except Exception as error:
                print(
                    "Failed to construct "
                    "EphemeralResourcePrincipalSigner:"
                )
                print(f"{type(error).__name__}: {error}")
                raise

            print("EphemeralResourcePrincipalSigner created")

            # These values come from RPST claims and are not credentials.
            for claim in (
                "res_type",
                "res_tenant",
                "res_compartment",
            ):
                try:
                    value = signer.get_claim(claim)
                except Exception:
                    value = None

                if value is not None:
                    print(f"RPST claim {claim}: {value}")


            # ------------------------------------------------------------------
            # OCI Vault authorization
            # ------------------------------------------------------------------

            heading("6. OCI Vault access")

            secrets_client = oci.secrets.SecretsClient(
                {
                    "region": region,
                },
                signer=signer,
            )

            try:
                bundle_response = secrets_client.get_secret_bundle_by_name(
                    secret_name="yalom-telegram-token",
                    vault_id=vault_id,
                    stage="CURRENT",
                )
            except oci.exceptions.ServiceError as error:
                print("OCI Vault request failed")
                print(f"HTTP status: {error.status}")
                print(f"OCI code: {error.code}")
                print(f"Message: {error.message}")
                print(f"opc-request-id: {error.request_id}")
                raise

            bundle = bundle_response.data
            content = bundle.secret_bundle_content.content

            if not content:
                raise RuntimeError(
                    "Vault API request succeeded but secret content is empty"
                )

            print("Vault request succeeded")
            print("Secret yalom-telegram-token was retrieved")
            print("Secret value was NOT printed or decoded")


            # ------------------------------------------------------------------
            # Result
            # ------------------------------------------------------------------

            heading("RESULT")

            print("GitHub OIDC: OK")
            print("OCI Identity Propagation Trust: OK")
            print("OCI RPST token exchange: OK")
            print("OCI RPST signing: OK")
            print("OCI Vault IAM authorization: OK")
            PY