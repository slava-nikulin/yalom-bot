name: Sync Cargo lockfile (temporary)

on:
  pull_request:
    paths:
      - Cargo.toml
      - .github/workflows/sync-cargo-lock.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/nudge-observability-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Refresh lockfile using Cargo resolver
        run: |
          cargo update -p ctutils --precise 0.4.7
          cargo metadata --format-version 1 > /dev/null
      - name: Commit lockfile update to existing PR
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Cargo.lock for mysql-rsa"
          git push origin HEAD:fix/nudge-observability-20261030
