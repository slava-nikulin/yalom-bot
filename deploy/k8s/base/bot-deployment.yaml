apiVersion: apps/v1
kind: Deployment

metadata:
  name: yalom-bot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: yalom-bot

  template:
    metadata:
      labels:
        app: yalom-bot

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: yalom-bot

          image: ghcr.io/slava-nikulin/yalom-bot:latest

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: yalom-bot-config
            - secretRef:
                name: yalom-bot-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
