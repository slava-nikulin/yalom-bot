apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: yalom-bot

spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: https

  rules:
    - matches:
        - path:
            type: Exact
            value: /tg/webhook

      backendRefs:
        - name: yalom-bot
          port: 80
