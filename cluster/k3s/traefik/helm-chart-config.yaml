apiVersion: helm.cattle.io/v1
kind: HelmChartConfig

metadata:
  name: traefik
  namespace: kube-system

spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet

    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0

    providers:
      kubernetesGateway:
        enabled: true

      kubernetesIngress:
        enabled: false

      kubernetesCRD:
        enabled: true

    gateway:
      enabled: false

    gatewayClass:
      enabled: false

    service:
      enabled: false

    ports:
      web:
        port: 80
        containerPort: 80
        hostPort: 80

      websecure:
        port: 443
        containerPort: 443
        hostPort: 443

    securityContext:
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
