apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  name: letsencrypt-shortlived

spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory

    profile: shortlived

    privateKeySecretRef:
      name: letsencrypt-shortlived-account-key

    solvers:
      - http01:
          gatewayHTTPRoute:
            serviceType: ClusterIP

            parentRefs:
              - name: public-gateway
                namespace: gateway-system
                kind: Gateway
                sectionName: http
